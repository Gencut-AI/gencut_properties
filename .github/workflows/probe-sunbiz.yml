name: Probe Sunbiz SFTP
on: { push: { branches: [probe/sunbiz] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get install -y -qq lftp > /dev/null 2>&1
      - name: Profile the daily corporate filings (counts only, no names)
        env:
          SFTP_PASS: PubAccess1845! # gitleaks:allow (published public login)
        run: |
          L() { lftp -u "Public,$SFTP_PASS" -e "set sftp:auto-confirm yes; set net:timeout 30; $1; bye" sftp://sftp.floridados.gov; }
          L "cls -l doc/cor" | grep -E 'c\.txt' | tail -12 | sed 's/^/LIST /'
          L "cls -1 doc/cor" | grep -E '[0-9]{8}c\.txt$' | sort | tail -10 > recent.txt
          echo "FILES_LISTED $(L 'cls -1 doc/cor' | grep -cE '[0-9]{8}c\.txt$')"
          echo "OLDEST $(L 'cls -1 doc/cor' | grep -E '[0-9]{8}c\.txt$' | sort | head -1)"
          for f in $(cat recent.txt); do L "get doc/cor/$(basename $f) -o d.txt" >/dev/null 2>&1 || continue
            n=$(wc -l < d.txt)
            dade=$(cut -c335-339 d.txt | grep -cE '^33(0|1)[0-9]{2}')
            dadeLLC=$(paste -d'|' <(cut -c335-339 d.txt) <(cut -c206-220 d.txt) | grep -cE '^33(0|1)[0-9]{2}\|FLAL')
            prop=$(paste -d'|' <(cut -c335-339 d.txt) <(cut -c13-204 d.txt) | grep -E '^33(0|1)[0-9]{2}\|' | grep -ciE 'propert|realty|homes|holdings|invest|capital|real estate|acquisit|rental|estates')
            people=$(paste -d'|' <(cut -c335-339 d.txt) <(cut -c673) <(cut -c673 d.txt) | grep -cE '^33(0|1)[0-9]{2}\|')
            echo "DAY $(basename $f) lines=$n dade=$dade dade_llc=$dadeLLC dade_property_names=$prop"
          done
          awk '{print length($0)}' d.txt | sort | uniq -c | sort -rn | head -3 | sed 's/^/LEN /'
          cut -c205 d.txt | sort | uniq -c | sed 's/^/STATUS /'
          cut -c206-220 d.txt | sort | uniq -c | sort -rn | head -6 | sed 's/^/TYPE /'
          cut -c473-480 d.txt | sort | uniq -c | sort -rn | head -3 | sed 's/^/FILED /'
          cut -c669-672 d.txt | sort | uniq -c | sort -rn | head -6 | sed 's/^/TITLE1 /'
          cut -c673 d.txt | sort | uniq -c | sed 's/^/OTYPE1 /'
