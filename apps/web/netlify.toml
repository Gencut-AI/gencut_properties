# Netlify build for the GenCut web app (pnpm monorepo).
# Netlify UI → Project configuration → Build & deploy → Build settings:
#   Base directory:    (empty — repository root)
#   Package directory: apps/web
# Next.js is deployed by Netlify's built-in OpenNext runtime; no plugin pin.
[build]
  command = "pnpm --filter @gencut/web build"
  # Paths here are relative to the base directory (the repository root),
  # not to the package directory.
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.0"

# Background jobs that outlast a page request (campaign drafting). Relative to
# the base directory, like `publish`.
[functions]
  directory = "apps/web/netlify/functions"

# Bundle the drafting function with everything it imports: it imports GenCut's
# workspace packages as TypeScript source, which only a bundler resolves.
# Scoped to this function so the Next.js server keeps Netlify's own packaging.
[functions."generate-campaign-background"]
  node_bundler = "esbuild"
