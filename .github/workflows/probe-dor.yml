name: Probe FL DOR roll (temporary)

on:
  push:
    branches: [m2/discovery]
    paths: [.github/workflows/probe-dor.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List NAL folders and download Miami-Dade file
        run: |
          set -euo pipefail
          api="https://floridarevenue.com/property/dataportal/_api/web/GetFolderByServerRelativeUrl('%2Fproperty%2Fdataportal%2FDocuments%2FPTO%20Data%20Portal%2FTax%20Roll%20Data%20Files%2FNAL%2F2026P')/Files?\$select=Name,ServerRelativeUrl,Length"
          curl -sS -H 'Accept: application/json;odata=nometadata' "$api" -o files.json -w "api HTTP %{http_code}\n"
          url=$(python3 -c "import json,urllib.parse;v=[f for f in json.load(open('files.json'))['value'] if f['Name'].startswith('Dade 23')][0];print('https://floridarevenue.com'+urllib.parse.quote(v['ServerRelativeUrl']))")
          echo "::notice title=file url::$url"
          curl -sS -L "$url" -o dade.zip -w "download HTTP %{http_code} %{size_download} bytes in %{time_total}s\n"
          unzip -l dade.zip | tail -5
          echo "::notice title=zip contents::$(unzip -Z1 dade.zip | tr '\n' ' ')"
      - name: Summarize header and ZIP 33180 (no personal data)
        run: |
          set -euo pipefail
          f=$(unzip -Z1 dade.zip | grep -i '\.csv$' | head -1)
          unzip -p dade.zip "$f" > nal.csv
          python3 - <<'PY'
          import csv, collections
          with open('nal.csv', newline='', encoding='latin-1') as fh:
              r = csv.DictReader(fh)
              header = r.fieldnames
              total = 0; z = collections.Counter(); ex = {}
              blank_owner = 0
              hm = collections.Counter(); sale_years = collections.Counter()
              for row in r:
                  total += 1
                  if row.get('PHY_ZIPCD','').strip()[:5] == '33180':
                      uc = row.get('DOR_UC','').strip(); z[uc] += 1
                      if not row.get('OWN_NAME','').strip(): blank_owner += 1
                      hm['homestead' if (row.get('JV_HMSTD','').strip() not in ('','0')) else 'none'] += 1
                      sale_years[row.get('SALE_YR1','').strip() or 'blank'] += 1
                      if uc not in ex:
                          ex[uc] = {k: row.get(k,'') for k in ('CO_NO','ASMNT_YR','DOR_UC','JV','AV_SD','JV_HMSTD','EXMPT_01','SALE_YR1','SALE_MO1','QUAL_CD1','OWN_STATE','OWN_ZIPCD','PHY_ZIPCD','NO_RES_UNTS','ACT_YR_BLT','TOT_LVG_AREA')}
          print('::notice title=header::' + ','.join(header))
          print(f'::notice title=counts::total={total} zip33180_by_use={dict(sorted(z.items()))} blank_owner={blank_owner} homestead={dict(hm)} sale_yr1={dict(sorted(sale_years.items()))}')
          for uc, v in sorted(ex.items()):
              print(f'::notice title=example {uc}::{v}')
          PY
