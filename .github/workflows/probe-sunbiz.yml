name: Probe Sunbiz SFTP
on: { push: { branches: [probe/sunbiz] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get install -y -qq lftp > /dev/null 2>&1
      - name: Download and profile the quarterly corporate file (counts only, no names)
        env:
          SFTP_PASS: PubAccess1845!
        run: |
          start=$(date +%s)
          timeout 1200 lftp -u "Public,$SFTP_PASS" -e "set sftp:auto-confirm yes; set net:timeout 30; get doc/quarterly/cor/cordata.zip -o cordata.zip; bye" sftp://sftp.floridados.gov
          echo "DOWNLOAD_SECONDS $(( $(date +%s) - start ))"; ls -l cordata.zip
          unzip -l cordata.zip | tail -15
          F=$(unzip -Z1 cordata.zip | head -1); echo "FIRST_MEMBER $F"
          start=$(date +%s); echo "LINES_ALL $(unzip -p cordata.zip | wc -l)"; echo "SCAN_SECONDS $(( $(date +%s) - start ))"
          unzip -p cordata.zip "$F" | awk '{print length($0)}' | sort | uniq -c | sort -rn | head -3 | sed 's/^/LEN /'
          unzip -p cordata.zip "$F" | cut -c205 | sort | uniq -c | sed 's/^/STATUS /'
          unzip -p cordata.zip "$F" | cut -c206-220 | sort | uniq -c | sort -rn | head -10 | sed 's/^/TYPE /'
          unzip -p cordata.zip "$F" | cut -c669-672 | sort | uniq -c | sort -rn | head -12 | sed 's/^/TITLE1 /'
          unzip -p cordata.zip "$F" | cut -c673 | sort | uniq -c | sed 's/^/OTYPE1 /'
          unzip -p cordata.zip "$F" | cut -c473-480 | sort | tail -1 | sed 's/^/MAX_FILEDATE /'
          unzip -p cordata.zip "$F" | cut -c496-503 | sort | tail -1 | sed 's/^/MAX_LASTTX /'
          unzip -p cordata.zip "$F" | cut -c13-204 | grep -c " LLC" | sed 's/^/LLC_NAMES /'
          unzip -p cordata.zip "$F" | file - | sed 's/^/ENCODING /'
          unzip -p cordata.zip "$F" | head -2 | cut -c1-12,205-220,473-480,506-544 | sed 's/^/SAMPLE /'
