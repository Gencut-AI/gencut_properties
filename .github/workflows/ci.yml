name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Add `cache: pnpm` once pnpm-lock.yaml is committed (it requires the lockfile).

      - name: Install
        # Switch to --frozen-lockfile once pnpm-lock.yaml is committed.
        run: pnpm install

      - name: Repository lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (unit, schema, migrations)
        run: pnpm test

      - name: Build web app
        run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets (gitleaks)
        # Runs the gitleaks CLI image directly; the GitHub Action needs a
        # licence for organisation repositories.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --redact --verbose --exit-code 1
