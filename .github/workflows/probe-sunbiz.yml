name: Probe Sunbiz SFTP
on: { push: { branches: [probe/sunbiz] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: sudo apt-get install -y -qq sshpass lftp > /dev/null 2>&1
      - name: Try access methods (public access published by the Florida Department of State)
        env:
          SFTP_PASS: PubAccess1845!
        run: |
          echo "== web portal"; curl -sS -o portal.html -w "%{http_code} %{url_effective}\n" -L https://sftp.floridados.gov/ ; grep -oiE "<title>[^<]*</title>|moveit|goanywhere|globalscape|crushftp|sftpgo|filezilla|serv-u|cerberus|jscape|axway|kiteworks" portal.html | sort -u | head
          for U in Public public; do
            for M in password keyboard-interactive; do
              echo "== sftp $U $M"
              printf 'ls -l\n' > b.txt
              timeout 40 sshpass -p "$SFTP_PASS" sftp -oStrictHostKeyChecking=accept-new -oPreferredAuthentications=$M -oPubkeyAuthentication=no -b b.txt "$U@sftp.floridados.gov" 2>&1 | grep -vE "NOTICE|Attention|^$|property of the State|limited to|use described|Unauthorized or improper" | head -8
            done
          done
          echo "== lftp"; timeout 60 lftp -u "Public,$SFTP_PASS" -e "set sftp:auto-confirm yes; ls; ls doc/quarterly/cor; bye" sftp://sftp.floridados.gov 2>&1 | head -20
          echo "== curl sftp"; timeout 60 curl -sS -k --user "Public:$SFTP_PASS" "sftp://sftp.floridados.gov/" 2>&1 | head -10
          echo "== ftps"; timeout 40 curl -sS --ssl-reqd --user "Public:$SFTP_PASS" "ftp://sftp.floridados.gov/" 2>&1 | head -5
